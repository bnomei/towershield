[workspace]
resolver = "2"
members = [
    "crates/shield-core",
    "crates/shield-tower",
    "crates/shield-cloudflare",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/bnomei/towershield"
homepage = "https://github.com/bnomei/towershield"
readme = "README.md"
authors = ["TowerShield contributors"]

[workspace.dependencies]
# Core
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
thiserror = "2.0.20"
regex = { version = "1.13.1", default-features = false, features = ["std"] }
rayon = "1.12.0"

# Tower / Axum
tower-layer = "0.3.3"
tower-service = "0.3.3"
tower = { version = "0.5.3", features = ["util"], default-features = false }
pin-project = "1.1.13"
# Observability
tracing = { version = "0.1.44", default-features = false }

# Dev / test
axum = { version = "0.8.9", features = ["tokio"] }
bytes = "1.12.1"
divan = "0.1.21"
http-body-util = "0.1.4"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "net"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
