[package]
name = "towershield-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
documentation = "https://docs.rs/towershield-core"
description = "Portable rules and matchers for blocking common vulnerability-scanner paths."
keywords = ["security", "waf", "denylist", "firewall", "http"]
categories = ["web-programming", "network-programming", "security"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "towershield_core"

[features]
default = ["serde", "regex"]
serde = ["dep:serde", "dep:serde_json", "dep:toml"]
regex = ["dep:regex"]
rayon = ["dep:rayon", "regex"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
divan = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[[bench]]
name = "core_checker"
harness = false
