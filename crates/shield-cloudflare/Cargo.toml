[package]
name = "towershield-cloudflare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
documentation = "https://docs.rs/towershield-cloudflare"
description = "Offline Cloudflare Ruleset Engine expression exporter for TowerShield."
keywords = ["cloudflare", "waf", "security", "shield", "firewall"]
categories = ["web-programming", "network-programming"]

[lib]
name = "towershield_cloudflare"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json", "towershield-core/serde"]
regex = ["towershield-core/regex"]
rayon = ["towershield-core/rayon"]

[dependencies]
towershield-core = { version = "0.1.0", path = "../shield-core" }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
