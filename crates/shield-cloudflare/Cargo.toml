[package]
name = "towershield-cloudflare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
documentation = "https://docs.rs/towershield-cloudflare"
description = "Export TowerShield rules as offline Cloudflare WAF expressions and Rulesets API payloads."
keywords = ["cloudflare", "waf", "firewall", "security", "ruleset"]
categories = ["web-programming", "network-programming", "security", "config"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "towershield_cloudflare"

[features]
default = ["serde", "regex"]
serde = ["dep:serde", "dep:serde_json", "towershield-core/serde"]
regex = ["towershield-core/regex"]
rayon = ["towershield-core/rayon"]

[dependencies]
towershield-core = { version = "0.1.1", path = "../shield-core", default-features = false }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
