[package]
name = "towershield"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
documentation = "https://docs.rs/towershield"
description = "Tower middleware that blocks common vulnerability-scanner paths before they reach your application."
keywords = ["tower", "axum", "middleware", "security", "waf"]
categories = ["web-programming::http-server", "network-programming", "security"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "towershield"

[features]
default = ["tracing", "regex"]
tracing = ["dep:tracing"]
regex = ["towershield-core/regex"]
rayon = ["regex", "towershield-core/rayon"]

[dependencies]
towershield-core = { version = "0.1.1", path = "../shield-core", default-features = false }
http = { workspace = true }
tower-layer = { workspace = true }
tower-service = { workspace = true }
tracing = { workspace = true, optional = true }
pin-project = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
