[package]
name = "tower-http-shield"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
documentation = "https://docs.rs/tower-http-shield"
description = "Tower Layer and Service for the tower-http-shield path denylist middleware."
keywords = ["tower", "middleware", "security", "shield", "axum"]
categories = ["web-programming", "network-programming"]

[lib]
name = "shield_tower"

[features]
default = ["tracing"]
tracing = ["dep:tracing"]
regex = ["shield-core/regex"]
rayon = ["shield-core/rayon"]

[dependencies]
shield-core = { package = "tower-http-shield-core", version = "0.1.0", path = "../shield-core" }
http = { workspace = true }
tower-layer = { workspace = true }
tower-service = { workspace = true }
tracing = { workspace = true, optional = true }
pin-project = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
